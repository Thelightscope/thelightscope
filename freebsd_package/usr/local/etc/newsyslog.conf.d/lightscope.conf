# LightScope service log rotation. The signal (1 = SIGHUP) goes to daemon(8),
# which was started with -H and reopens the file after rotation.
# logfilename                        [owner:group]          mode count size when flags [/pid_file]                         [sig_num]
/var/log/lightscope/lightscope.log   lightscope:lightscope  640  7     10000 *    JC    /var/run/lightscope/lightscope.pid 1
