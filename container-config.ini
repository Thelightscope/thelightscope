# LightScope Container Configuration
# This configuration file is optimized for containerized deployments

[Settings]
# Database identifier - automatically generated during installation
# This is your unique identifier for viewing reports at https://thelightscope.com/light_table/
database = 

# Randomization key for IP address anonymization
# Automatically generated during installation for privacy protection
randomization_key = 

# Auto-update configuration
# Set to 'yes' to enable automatic updates (recommended for containers)
autoupdate = yes

# Honeypot SSH/Telnet forwarding
# Set to 'yes' to enable honeypot services that forward to remote servers
# This allows capturing attacker interactions for analysis
self_telnet_and_ssh_honeypot_ports_to_forward = no

[Container]
# Container-specific settings

# Memory management
# Maximum memory usage before triggering graceful restart (in MB)
memory_limit_mb = 512

# Memory warning threshold (percentage of limit)
memory_warning_threshold = 85

# Packet capture settings
# Buffer size for packet capture (bytes)
capture_buffer_size = 1048576

# Maximum packets to buffer before processing
max_packet_buffer = 10000

# Network interface monitoring
# Leave empty to auto-detect all interfaces
# Specify interface names separated by commas for specific interfaces
# Example: eth0,wlan0
monitored_interfaces = 

# Honeypot configuration
# Enable dynamic honeypot port rotation
enable_honeypot_rotation = yes

# Honeypot rotation interval (hours)
honeypot_rotation_hours = 4

# Number of honeypot ports to maintain
honeypot_port_count = 10

# Priority ports to prefer for honeypots (comma-separated)
honeypot_priority_ports = 2323,6379,8080,5555,17001,2222,12281,8728,1024

[Logging]
# Logging configuration for containers

# Log level (DEBUG, INFO, WARNING, ERROR)
log_level = INFO

# Maximum log file size (MB)
max_log_size_mb = 10

# Number of log files to keep
log_file_count = 5

# Enable structured logging for container environments
structured_logging = yes

[Security]
# Security settings for containerized deployment

# Enable additional security checks
enhanced_security = yes

# Randomize internal timing to prevent fingerprinting
randomize_timing = yes

# Maximum connection attempts per IP per minute
max_connections_per_ip = 100

# Enable rate limiting for honeypot connections
enable_rate_limiting = yes

[Performance]
# Performance tuning for containers

# Number of worker processes (0 = auto-detect based on CPU cores)
worker_processes = 0

# Packet processing batch size
packet_batch_size = 280

# Network I/O timeout (seconds)
network_timeout = 30

# Enable performance monitoring
performance_monitoring = yes

# Statistics reporting interval (seconds)
stats_interval = 300

[Advanced]
# Advanced configuration options

# Custom user agent for HTTP requests
user_agent = LightScope/1.0.15 (Container)

# API endpoint for reporting (do not change unless instructed)
api_endpoint = https://thelightscope.com/log_mysql_data

# Heartbeat endpoint
heartbeat_endpoint = https://thelightscope.com/heartbeat

# Update check endpoint
update_endpoint = https://thelightscope.com/latest/version

# Connection timeout for API requests (seconds)
api_timeout = 30

# Retry attempts for failed API requests
api_retry_attempts = 3

# Enable debug mode (increases logging verbosity)
debug_mode = no

# Custom environment identifier (useful for multiple deployments)
environment_id = 

[Notifications]
# Notification settings (future feature)

# Enable email notifications for critical events
enable_email_notifications = no

# Email address for notifications
notification_email = 

# Webhook URL for custom notifications
webhook_url = 

# Notification threshold (events per hour to trigger notification)
notification_threshold = 100
