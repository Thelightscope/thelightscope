# LightScope Network Security Monitor - Docker Compose Configuration
# This file provides a complete containerized deployment of LightScope

version: '3.8'

services:
  lightscope:
    build: 
      context: .
      dockerfile: Dockerfile
    image: lightscope:latest
    container_name: lightscope-monitor
    
    # Restart policy - always restart including on OOM
    restart: unless-stopped
    
    # Resource limits with memory management
    deploy:
      resources:
        limits:
          memory: 512M      # Hard memory limit
          cpus: '1.0'       # CPU limit
        reservations:
          memory: 256M      # Guaranteed memory
          cpus: '0.5'       # Guaranteed CPU
    
    # Network configuration for packet capture
    network_mode: host
    cap_add:
      - NET_RAW           # Raw socket access for packet capture
      - NET_ADMIN         # Network interface management
      - NET_BIND_SERVICE  # Bind to privileged ports for honeypots
    
    # Security settings
    security_opt:
      - no-new-privileges:true
    read_only: false  # Need write access for logs and updates
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - CONTAINER_MEMORY_LIMIT_MB=512
      - LIGHTSCOPE_CONFIG=/opt/lightscope/config/config.ini
      - TZ=${TZ:-UTC}
    
    # Volume mounts for persistent data
    volumes:
      # Configuration (persistent)
      - lightscope-config:/opt/lightscope/config
      # Logs (persistent)  
      - lightscope-logs:/opt/lightscope/logs
      # Updates cache (persistent)
      - lightscope-updates:/opt/lightscope/updates
      # Temporary files (tmpfs for performance)
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 100M
    
    # Health check with memory awareness
    healthcheck:
      test: |
        python3 -c "
        import psutil, sys, os
        try:
            # Check if lightscope processes are running
            procs = [p for p in psutil.process_iter(['name']) if 'lightscope' in p.info['name']]
            # Check memory usage
            mem_mb = psutil.Process().memory_info().rss / 1024 / 1024
            limit = int(os.environ.get('CONTAINER_MEMORY_LIMIT_MB', '512'))
            # Healthy if processes running and memory < 90% of limit
            healthy = len(procs) > 0 and mem_mb < limit * 0.9
            print(f'Processes: {len(procs)}, Memory: {mem_mb:.1f}MB/{limit}MB, Healthy: {healthy}')
            sys.exit(0 if healthy else 1)
        except Exception as e:
            print(f'Health check error: {e}')
            sys.exit(1)
        "
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=lightscope"
    
    # Labels for management
    labels:
      - "com.thelightscope.service=lightscope-monitor"
      - "com.thelightscope.version=1.0.15"

# Named volumes for persistent data
volumes:
  lightscope-config:
    driver: local
    labels:
      - "com.thelightscope.volume=config"
  
  lightscope-logs:
    driver: local
    labels:
      - "com.thelightscope.volume=logs"
  
  lightscope-updates:
    driver: local
    labels:
      - "com.thelightscope.volume=updates"

# Networks (using host network for packet capture)
networks:
  default:
    external: true
    name: host
